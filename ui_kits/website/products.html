<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Products — Mishthi Sattva</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; }
  .ms-stack { }
  .ms-why-grid { grid-template-columns: repeat(3, 1fr); }

  /* Category product grid — fixed columns so a category with only 2 items
     (e.g. Hair Care) doesn't stretch its cards across the full width. */
  .ms-catgrid { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 1040px) { .ms-catgrid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 760px)  { .ms-catgrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px)  { .ms-catgrid { grid-template-columns: 1fr; } }

  /* Uniform product frames, without cropping the products.
     The card's 1:1 frame was collapsing to each photo's own height (because the
     in-flow image drove its height), so every card came out a different size.
     Absolutely positioning the image lets the 1:1 frame control the box, while
     object-fit: contain keeps the whole product pack visible — cover would crop
     packaging and labels. Photos are centred on the cream frame. */
  .ms-catgrid div[style*="aspect-ratio"] { position: relative; overflow: hidden; }
  .ms-catgrid div[style*="aspect-ratio"] > img {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    max-height: none !important;
    object-fit: contain !important;
  }

  /* mobile sticky call + whatsapp bar (hidden on desktop) */
  .ms-mobilebar { display: none; }
  @media (max-width: 680px) {
    .ms-mobilebar { display: flex; }
    .ms-fab { display: none !important; }
    main { padding-bottom: 76px; }
  }

  @media (max-width: 860px) {
    .ms-stack { grid-template-columns: 1fr !important; }
    .ms-nav { display: none !important; }
    .ms-why-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    .ms-why-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 680px) {
    h1 { font-size: 42px !important; }
    h2 { font-size: 32px !important; }
    section { padding-top: 56px !important; padding-bottom: 56px !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/ms-data.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" src="Sections.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById("root")).render(<window.MSWebsite.ProductsPage />);
  </script>
</body>
</html>
