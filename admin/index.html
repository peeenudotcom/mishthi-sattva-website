<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Mishthi Sattva</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
  tbody tr:hover { background: color-mix(in oklab, var(--secondary) 40%, transparent); }
  input, select, textarea {
    font-family: var(--font-sans); font-size: 14px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    color: var(--foreground); width: 100%; box-sizing: border-box;
  }
  input.num { max-width: 110px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 18px; }
  .tab {
    padding: 9px 16px; border-radius: var(--radius-pill); border: 1px solid var(--border);
    background: var(--card); color: var(--primary); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .tab.on { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .btn {
    padding: 9px 16px; border-radius: var(--radius-pill); border: none; cursor: pointer;
    background: var(--primary); color: var(--primary-foreground); font-weight: 600; font-size: 14px;
  }
  .btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-2xl); padding: 22px; }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-pill); }
  .muted { color: var(--muted-foreground); font-size: 13px; }
  @media (max-width: 720px) { .hide-sm { display: none; } }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../js/config.js"></script>
  <script src="../js/ms-data.js"></script>
  <script type="text/babel" src="admin.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById("root")).render(<window.MSAdminApp />);
  </script>
</body>
</html>
